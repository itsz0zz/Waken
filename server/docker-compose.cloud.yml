# Waken accounts and network, deployed by Dokploy (Docker Compose, from the Git repository).
#   Compose path in Dokploy: ./server/docker-compose.cloud.yml
#   Domains in Dokploy (HTTPS, Let's Encrypt):
#     net.wakenplay.fr -> service "headscale", port 8080 (the devices: long-lived connections)
#     api.wakenplay.fr -> service "accounts",  port 8080 (the apps)
#   Environment in Dokploy: HEADSCALE_API_KEY (after the first deploy, see server/DEPLOY.md).
# No published port: Traefik (Dokploy) is the only way in.
# Data on the server's iSCSI disk: ${WAKEN_DATA}/headscale (the network) and ${WAKEN_DATA}/accounts (accounts,
# session keys). A local filesystem, so SQLite is safe there (never put it on NFS or SMB).
services:
  headscale:
    image: headscale/headscale:0.29.7
    command: serve
    restart: unless-stopped
    environment:
      HEADSCALE_SERVER_URL: ${NET_URL:-https://net.wakenplay.fr}
    volumes:
      - ./headscale/config.yaml:/etc/headscale/config.yaml:ro
      - ./headscale/policy.hujson:/etc/headscale/policy.hujson:ro
      - ${WAKEN_DATA:-/srv/iscsi/docker-data/waken}/headscale:/var/lib/headscale
    expose:
      - "8080"

  # The accounts run as the .NET images' non-root user (1654): its folder on the disk must be theirs.
  accounts-init:
    image: alpine:3.24
    command: ["sh", "-c", "mkdir -p /data && chown 1654:1654 /data && chmod 700 /data"]
    volumes:
      - ${WAKEN_DATA:-/srv/iscsi/docker-data/waken}/accounts:/data
    restart: "no"

  accounts:
    build:
      context: ./Waken.Cloud
    restart: unless-stopped
    depends_on:
      headscale:
        condition: service_started
      accounts-init:
        condition: service_completed_successfully
    environment:
      Cloud__HeadscaleUrl: http://headscale:8080
      # Empty on the very first deploy: the service then stops with a clear message until it is set.
      Cloud__HeadscaleApiKey: ${HEADSCALE_API_KEY:-}
      Cloud__ControlUrl: ${NET_URL:-https://net.wakenplay.fr}
      # Behind Traefik: the client address comes from X-Forwarded-For (rate limits per address).
      Cloud__TrustForwardedHeaders: "true"
      # Notifications (needs a paid Apple Developer team): the .p8 key goes into ${WAKEN_DATA}/accounts (seen as /data).
      Cloud__Apns__KeyPath: ${APNS_KEY_PATH:-}
      Cloud__Apns__KeyId: ${APNS_KEY_ID:-}
      Cloud__Apns__TeamId: ${APNS_TEAM_ID:-}
      Cloud__Apns__IosTopic: ${APNS_IOS_TOPIC:-}
      Cloud__Apns__MacTopic: ${APNS_MAC_TOPIC:-}
      # Continuer avec Apple: the key that revokes Apple's tokens when an account is deleted (it may be the APNs
      # key, with "Sign in with Apple" enabled). Left empty, sign-in works, deletion revokes nothing.
      Cloud__Apple__KeyPath: ${APPLE_KEY_PATH:-}
      Cloud__Apple__KeyId: ${APPLE_KEY_ID:-}
      Cloud__Apple__TeamId: ${APPLE_TEAM_ID:-}
    volumes:
      - ${WAKEN_DATA:-/srv/iscsi/docker-data/waken}/accounts:/data
    expose:
      - "8080"
