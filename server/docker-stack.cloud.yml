# Waken accounts and network: docker stack deploy -c docker-stack.cloud.yml waken-cloud
# The homelab's reverse proxy serves both over HTTPS:
#   https://net.wakenplay.fr -> headscale:8080  (the devices, long-lived connections)
#   https://api.wakenplay.fr -> accounts:8080   (the apps)
# The proxy joins the "cloud" network (attachable) to reach them; neither publishes a port.
# First deploy: start headscale alone, create the API key inside it
#   docker exec $(docker ps -qf name=waken-cloud_headscale) headscale apikeys create --expiration 365d
# then set HEADSCALE_API_KEY and deploy again.
# Keep "-" and ":" out of the ${VAR:?message} messages: docker stack parses them as default-value separators.
version: "3.8"
services:
  headscale:
    image: headscale/headscale:0.29.7
    command: serve
    environment:
      HEADSCALE_SERVER_URL: ${NET_URL:-https://net.wakenplay.fr}
    volumes:
      - ./headscale/config.yaml:/etc/headscale/config.yaml:ro
      - ./headscale/policy.hujson:/etc/headscale/policy.hujson:ro
      - headscale-data:/var/lib/headscale
    networks: [cloud]
    deploy:
      replicas: 1

  accounts:
    image: ${WAKEN_CLOUD_IMAGE:?WAKEN_CLOUD_IMAGE manquant}
    environment:
      Cloud__HeadscaleUrl: http://headscale:8080
      Cloud__HeadscaleApiKey: ${HEADSCALE_API_KEY:?HEADSCALE_API_KEY manquant}
      Cloud__ControlUrl: ${NET_URL:-https://net.wakenplay.fr}
      Cloud__TrustForwardedHeaders: "true"
      # Notifications: a key from developer.apple.com (Keys, Apple Push Notifications service).
      # Left empty, they are only logged.
      Cloud__Apns__KeyPath: ${APNS_KEY_PATH:-}
      Cloud__Apns__KeyId: ${APNS_KEY_ID:-}
      Cloud__Apns__TeamId: ${APNS_TEAM_ID:-}
      Cloud__Apns__IosTopic: ${APNS_IOS_TOPIC:-}
      Cloud__Apns__MacTopic: ${APNS_MAC_TOPIC:-}
    volumes:
      - accounts-data:/data
      # Put the .p8 key in this volume (ex. /data/apns.p8) and set APNS_KEY_PATH to it.
    networks: [cloud]
    deploy:
      replicas: 1

networks:
  cloud:
    driver: overlay
    attachable: true

volumes:
  headscale-data:
  accounts-data:
